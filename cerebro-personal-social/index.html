<!DOCTYPE html>

<body>
    <header>
        <h1>Cerebro Personal-Social</h1>
    </header>

    <main>
        <section id="nuevo-proyecto-seccion">
            <h2>Crear Nuevo Proyecto</h2>
            <form id="form-nuevo-proyecto">
                <div>
                    <label for="proyecto-nombre">Nombre del Proyecto:</label>
                    <input type="text" id="proyecto-nombre" name="proyecto-nombre" required>
                </div>
                <div>
                    <label for="proyecto-descripcion">Descripción:</label>
                    <textarea id="proyecto-descripcion" name="proyecto-descripcion"></textarea>
                </div>
                <div>
                    <label for="proyecto-fecha-limite">Fecha Límite:</label>
                    <input type="date" id="proyecto-fecha-limite" name="proyecto-fecha-limite">
                </div>
                <div>
                    <label for="proyecto-prioridad">Prioridad:</label>
                    <select id="proyecto-prioridad" name="proyecto-prioridad">
                        <option value="media">Media</option>
                        <option value="alta">Alta</option>
                        <option value="baja">Baja</option>
                    </select>
                </div>
                <button type="submit">Crear Proyecto</button>
            </form>
        </section>

        <section id="proyectos-existentes-seccion">
